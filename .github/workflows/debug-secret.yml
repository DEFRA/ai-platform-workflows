name: Debug secret
on: pull_request
permissions: {}
jobs:
  direct:
    runs-on: ubuntu-26.04
    environment:
      name: release
      deployment: false
    steps:
      - run: echo "set=${{ secrets.GITOPS_APP_PRIVATE_KEY != '' }} len=${#K} client=${{ vars.GITOPS_APP_CLIENT_ID != '' }}"
        env:
          K: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
