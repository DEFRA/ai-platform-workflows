name: Infra checks

# Required checks on ai-platform-infra pull requests: `infra-checks /
# validate`, `/ lint`, `/ schemas`, `/ catalogue` and `/ security`. Offline
# in Phase 1: no plan and no Azure sign-in (D7). The checkov scan reports to
# code scanning and soft-fails until the Phase 1 findings are triaged.

on:
  workflow_call:

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DEFRA/ai-platform-workflows/.github/actions/setup@v1
        with:
          path: .
          terraform: 'true'

      - name: Format, validate and test with mock providers (R10)
        run: bash "$AIP_SCRIPTS/infra-checks.sh"

  lint:
    name: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - run: tflint --init --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: tflint --recursive --config "$PWD/.tflint.hcl"

      - uses: actions/setup-node@v7
        with:
          node-version-file: checks/.nvmrc
          cache: npm
          cache-dependency-path: checks/package-lock.json

      - run: npm ci --prefix checks --ignore-scripts --no-audit --no-fund

      - run: npm run lint --prefix checks

      - run: checks/node_modules/.bin/prettier --check .

  schemas:
    name: schemas
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: checks/.nvmrc
          cache: npm
          cache-dependency-path: checks/package-lock.json

      - run: npm ci --prefix checks --ignore-scripts --no-audit --no-fund

      - name: Schema and checks tests with coverage
        run: npm test --prefix checks

      - run: npm audit --prefix checks --audit-level=moderate

  catalogue:
    name: catalogue
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: checks/.nvmrc
          cache: npm
          cache-dependency-path: checks/package-lock.json

      - run: npm ci --prefix checks --ignore-scripts --no-audit --no-fund --omit=dev

      - run: node checks/bin/aip-checks.js catalogue --infra .

  security:
    name: security
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          quiet: true
          soft_fail: true

      - if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov
