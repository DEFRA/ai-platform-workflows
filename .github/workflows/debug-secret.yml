name: Debug secret
on: pull_request
permissions: {}
jobs:
  direct:
    runs-on: ubuntu-26.04
    environment:
      name: release
      deployment: false
    steps:
      - run: echo "direct len=${#K}"
        env:
          K: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
  called:
    uses: ./.github/workflows/debug-called.yml
    permissions:
      contents: read
  called-inherit:
    uses: ./.github/workflows/debug-called.yml
    secrets: inherit
    permissions:
      contents: read
