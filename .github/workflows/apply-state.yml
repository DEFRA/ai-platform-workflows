name: Apply state

# Applies one Terraform state, platform (called from ai-platform-deployments)
# or tenants (from ai-platform-tenants), for each environment that needs it,
# at the environment's pinned ai-platform-infra release, as
# id-aip-deploy-{env} through OIDC, with the apply safeguards of design C
# (R1 to R6, R12). The platform apply then dispatches the tenants apply. No
# step waits for a person. Each apply sends deploying, then deployed or
# deploy-failed, as events for the operations it carries (design B
# `#workflows`, `docs/async-operations-plan.md` section 5); a superseded,
# empty or cancelled run sends none.

on:
  workflow_call:
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        description: Private key of the ai-platform-orchestrator GitHub App.
        required: true
    inputs:
      state:
        description: platform or tenants.
        type: string
        required: true
      environment:
        description: The environment to apply; empty applies every environment whose desired state changed since its last successful apply.
        type: string
        required: false
        default: ''
      all:
        description: Applies every environment from main, whatever changed (reconcile-all). Takes no environment and no break-glass input.
        type: boolean
        required: false
        default: false
      allow_destroy:
        description: Break-glass, admins only. Lets plan-guard pass deletes; reported.
        type: boolean
        required: false
        default: false
      force_unlock:
        description: Break-glass, admins only. A state lease ID left by a lost runner (R6).
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  # First, before anything is read or changed: who dispatched this (AC18).
  access:
    name: access
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check who dispatched this
        uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: admin-check
        env:
          AIP_ADMIN_SCOPE: apply
          AIP_ENVIRONMENT: ${{ inputs.environment }}
          AIP_ACTOR: ${{ github.actor }}
          AIP_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AIP_BREAK_GLASS_INPUTS: ${{ inputs.allow_destroy || inputs.force_unlock != '' }}
          AIP_ALL: ${{ inputs.all }}
          # The caller's workflow file: the exemption for an engineer's
          # reconcile-all keys on it (DD25).
          AIP_WORKFLOW_REF: ${{ github.workflow_ref }}

  resolve:
    name: resolve
    needs: access
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      matrix: ${{ toJSON(fromJSON(steps.resolve.outputs.result).matrix) }}
    steps:
      - id: reader
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: ai-platform-environments,ai-platform-deployments,ai-platform-infra
          permission-contents: read
          permission-deployments: read

      - id: resolve
        uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: resolve-apply
          app-token: ${{ steps.reader.outputs.token }}
        env:
          AIP_STATE: ${{ inputs.state }}
          AIP_ENVIRONMENT: ${{ inputs.environment }}
          AIP_ALL: ${{ inputs.all }}
          AIP_CONFIG: config

      - if: toJSON(fromJSON(steps.resolve.outputs.result).matrix) != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: config
          path: config
          retention-days: 7

  # Each environment's pause is read in its `{env}-events` Environment, the
  # only one that holds AIP_PAUSED, so each leg records whether an exempt
  # App's dispatch is held back; the apply job reads it (section 5, Pause).
  gate:
    name: pause ${{ matrix.environment }}
    needs: resolve
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: ${{ matrix.environment }}-events
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      AIP_ENVIRONMENT: ${{ matrix.environment }}
      AIP_PAUSED: ${{ vars.AIP_PAUSED }}
      AIP_ACTOR: ${{ github.actor }}
      AIP_HELD_FILE: held.txt
    steps:
      - uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: pause-gate

      - uses: actions/upload-artifact@v7
        with:
          name: held-${{ matrix.environment }}
          path: held.txt
          retention-days: 1

  apply:
    name: ${{ matrix.environment }}
    needs: [resolve, gate]
    if: needs.resolve.outputs.matrix != '[]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 240
    environment:
      name: ${{ matrix.environment }}
    concurrency:
      group: ${{ inputs.state }}-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    env:
      AIP_STATE: ${{ inputs.state }}
      AIP_ENVIRONMENT: ${{ matrix.environment }}
      AIP_RELEASE: ${{ matrix.release }}
      AIP_ENTRA_ENABLED: ${{ matrix.entra_enabled }}
      AIP_TEAM_REGISTRATIONS: ${{ matrix.team_registrations }}
      AIP_CONFIG: config
      AIP_BREAK_GLASS: ${{ github.event_name == 'workflow_dispatch' && !endsWith(github.triggering_actor, '[bot]') }}
      AIP_ALLOW_DESTROY: ${{ inputs.allow_destroy }}
      AIP_FORCE_UNLOCK: ${{ inputs.force_unlock }}
      AIP_EVENT_SOURCE: apply
      AIP_EVENTS_QUEUE_URL: ${{ vars.AIP_EVENTS_QUEUE_URL }}
      AIP_EVENTS_ROLE_ARN: ${{ vars.AIP_EVENTS_ROLE_ARN }}
      AIP_EVENTS_CLIENT_ID: ${{ vars.AIP_EVENTS_CLIENT_ID }}
      AIP_EVENTS_AUDIENCE: ${{ vars.AIP_EVENTS_AUDIENCE }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: 'true'
      ARM_USE_CLI: 'false'
    steps:
      # A re-run of failed jobs reuses a successful access job, so the actor
      # of this attempt is checked again here, before any token or Terraform.
      # AIP_ENVIRONMENT is the input, as in the access job (the job's own is
      # the matrix leg).
      - name: Check who ran this attempt
        uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: admin-check
        env:
          AIP_ADMIN_SCOPE: apply
          AIP_ENVIRONMENT: ${{ inputs.environment }}
          AIP_ACTOR: ${{ github.actor }}
          AIP_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AIP_BREAK_GLASS_INPUTS: ${{ inputs.allow_destroy || inputs.force_unlock != '' }}
          AIP_ALL: ${{ inputs.all }}
          AIP_WORKFLOW_REF: ${{ github.workflow_ref }}

      # Reads the repository's rulesets, bypass lists included, which needs
      # Administration: read (the apply refuses to run if aip-machine-main or
      # aip-machine-protect changed).
      - id: checker
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read

      - id: preflight
        uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: preflight
          app-token: ${{ steps.checker.outputs.token }}

      - uses: actions/checkout@v7
        with:
          path: state
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: config
          path: config

      - uses: DEFRA/ai-platform-workflows/.github/actions/setup@v2
        with:
          sha: ${{ matrix.sha }}
          terraform: 'true'
          checks: 'true'

      # Which operations this apply carries, from the commits since the last
      # applied one, so the events can name them.
      - name: Name the operations in this apply
        run: bash "$AIP_SCRIPTS/apply.sh" operations

      - uses: actions/download-artifact@v8
        with:
          name: held-${{ matrix.environment }}
          path: held

      - uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: held
        env:
          AIP_HELD_FILE: held/held.txt

      # An App's dispatch (a retry or a reconcile) while the environment is
      # paused applies nothing; a push or an admin's hand run goes through.
      - name: Tell the Portal API the apply is held back
        if: env.AIP_HELD == 'true'
        uses: DEFRA/ai-platform-workflows/.github/actions/publish-event@v2
        with:
          status: deploy-failed
          run-report: run-report-${{ matrix.environment }}.json
          failure-code: paused
          failure-message: ${{ matrix.environment }} is paused; the apply changed nothing.

      - name: Tell the Portal API the apply has started
        if: env.AIP_HELD != 'true'
        uses: DEFRA/ai-platform-workflows/.github/actions/publish-event@v2
        with:
          status: deploying
          run-report: run-report-${{ matrix.environment }}.json

      - name: Plan and guard the plan (R4, R6, R2)
        id: plan
        if: env.AIP_HELD != 'true'
        run: bash "$AIP_SCRIPTS/apply.sh" plan

      - name: Apply the saved plan
        id: apply
        if: env.AIP_HELD != 'true'
        run: bash "$AIP_SCRIPTS/apply.sh" apply

      # Deleted Entra registrations count towards the deploy identity's
      # created-object limit for 30 days unless purged (direction 14 October
      # 2026, 3A). Graph allows it with Application.ReadWrite.OwnedBy.
      - if: steps.apply.outcome == 'success' && steps.plan.outputs.entra_deletes != '0'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Permanently delete the removed Entra registrations
        if: steps.apply.outcome == 'success' && steps.plan.outputs.entra_deletes != '0'
        run: bash "$AIP_SCRIPTS/apply.sh" purge

      # A held run records its report as paused: the backend corroborates the
      # paused deploy-failed from that outcome and the reconciler reads it, so
      # a report left pending would be dropped and the apply dispatched again.
      - name: Run report (R3, R12)
        if: always() && env.AIP_SCRIPTS != ''
        env:
          AIP_OUTCOME: ${{ env.AIP_HELD == 'true' && 'paused' || (steps.apply.outcome == 'success' && 'success' || 'failure') }}
        run: bash "$AIP_SCRIPTS/apply.sh" report

      # Once per operation: deployed, or deploy-failed with who is to blame.
      # A superseded run stopped at its preflight and a cancelled one send
      # nothing.
      - name: Tell the Portal API how the apply ended
        if: >-
          always() && !cancelled() && steps.preflight.outcome == 'success' &&
          env.AIP_HELD != 'true'
        uses: DEFRA/ai-platform-workflows/.github/actions/publish-event@v2
        with:
          status: ${{ steps.apply.outcome == 'success' && 'deployed' || 'deploy-failed' }}
          run-report: run-report-${{ matrix.environment }}.json

      - if: always() && hashFiles(format('run-report-{0}.json', matrix.environment)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: run-report-${{ matrix.environment }}.json
          path: run-report-${{ matrix.environment }}.json
          archive: false
          retention-days: 90

      # A held run applied nothing, but ran in the real Environment, so it ends
      # as failed: otherwise GitHub records the commit as deployed and
      # lastApplied trusts it.
      - name: End a held run as failed
        if: env.AIP_HELD == 'true'
        uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: end-held

  tenants:
    name: dispatch tenants apply
    needs: [resolve, apply]
    # The tenants apply follows every platform apply that ran; its own R5
    # check skips an environment whose platform apply failed.
    if: >-
      !cancelled() && inputs.state == 'platform' &&
      needs.resolve.result == 'success' && needs.resolve.outputs.matrix != '[]' &&
      needs.apply.result != 'skipped'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: dispatcher
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: ai-platform-tenants
          permission-actions: write

      - uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: dispatch-apply
          token: ${{ steps.dispatcher.outputs.token }}
        env:
          AIP_TARGET: tenants
          AIP_ENVIRONMENTS: ${{ toJSON(fromJSON(needs.resolve.outputs.matrix).*.environment) }}
          AIP_REASON: platform apply run ${{ github.run_id }}
