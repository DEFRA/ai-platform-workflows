name: Validate desired state

# The required check `validate-desired-state / validate` on every pull
# request in ai-platform-tenants and ai-platform-deployments: one stable name,
# because a pull request changes the files of exactly one environment.
# Offline in Phase 1 (D7): the checks run from ai-platform-infra at that
# environment's pinned release, with no Azure sign-in. A pull request that
# changes nothing under environments/ (`.github/`, the README) has no file to
# check and passes once someone has approved its head; the callers run it on
# pull_request_review too, and the ruleset's code-owner review (AC23) makes
# that approval one of aice-platform-admins for `.github/`.

on:
  workflow_call:
    secrets:
      GITOPS_APP_PRIVATE_KEY:
        description: Private key of the ai-platform-orchestrator GitHub App.
        required: true

permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      AIP_CONFIG: config
    steps:
      - id: reader
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: ai-platform-environments,ai-platform-deployments,ai-platform-infra
          permission-contents: read

      - name: Find the environment and its pinned release
        uses: DEFRA/ai-platform-workflows/.github/actions/gitops@v2
        with:
          command: prepare-validation
          app-token: ${{ steps.reader.outputs.token }}

      # A pull request that changes nothing under environments/ passes once it
      # is approved; prepare-validation says so, and there is no file to check.
      - if: env.AIP_SKIP_VALIDATION != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: state
          fetch-depth: 0
          persist-credentials: false

      - if: env.AIP_SKIP_VALIDATION != 'true'
        uses: DEFRA/ai-platform-workflows/.github/actions/setup@v2
        with:
          sha: ${{ env.AIP_SHA }}
          checks: 'true'

      - name: Validate
        if: env.AIP_SKIP_VALIDATION != 'true'
        run: bash "$AIP_SCRIPTS/desired-state.sh" validate
